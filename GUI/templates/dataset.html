<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Dataset</title>

    <!-- Link to the base stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    <!-- Link to the layout stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/layout.css') }}">
    <!-- Link to the components stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/components.css') }}">
</head>
<body>
    <header class="header">
        <h1>Configurar Dataset</h1>
    </header>
    <div class="container">
        <section>
            <form method="POST" action="{{ url_for('main.dataset') }}">
                <div class="form-group">
                    <label for="file_name">Nombre del fichero:</label>
                    <input type="text" id="file_name" name="file_name" value="{{ file_name }}">
                </div>
                <button class="button" type="submit">Guardar</button>
            </form>
        </section>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li class="flash info">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <!-- Link to return to the main menu -->
        <p><a href="{{ url_for('main.index') }}" class="back-button">Volver al Menú Principal</a></p>
    </div>

    <footer class="footer">
        <p>&copy; 2025 SBOpinionAnalysis</p>
    </footer>
</body>
</html>
